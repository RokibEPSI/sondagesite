<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposer un sondage</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand" href="#">Proposer un sondage</a>
      <div class="ms-auto">
        <a href="/" class="btn btn-light btn-sm">Retour à l'accueil</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0">Soumettez votre idée de sondage</h5>
      </div>
      <div class="card-body">

        <!-- Formulaire -->
        <form id="proposer-form">
          <div class="mb-3">
            <label class="form-label">Question du sondage</label>
            <input type="text" id="question" class="form-control" placeholder="Ex: Quel est votre sport préféré ?" required>
          </div>

          <div id="options" class="mb-3">
            <label class="form-label">Options</label>
            <input type="text" class="form-control mb-2 option" placeholder="Option 1" required>
            <input type="text" class="form-control mb-2 option" placeholder="Option 2" required>
          </div>

          <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="addOption()">+ Ajouter une option</button><br>
          <button type="submit" class="btn btn-success">Envoyer la proposition</button>
        </form>

        <!-- Message -->
        <div id="message" class="mt-3"></div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Ajouter une option
    function addOption() {
      const optionsDiv = document.getElementById('options');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'form-control mb-2 option';
      input.placeholder = 'Nouvelle option';
      optionsDiv.appendChild(input);
    }

    // Soumission du formulaire
    document.getElementById('proposer-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const question = document.getElementById('question').value.trim();
      const options = Array.from(document.querySelectorAll('.option'))
        .map(opt => opt.value.trim())
        .filter(v => v !== '');

      if (!question || options.length < 2) {
        document.getElementById('message').innerHTML =
          '<div class="alert alert-danger">Veuillez remplir la question et au moins deux options.</div>';
        return;
      }

      const res = await fetch('/api/proposer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, options })
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('message').innerHTML =
          `<div class="alert alert-success">${data.message}</div>`;
        document.getElementById('proposer-form').reset();
        document.getElementById('options').innerHTML = `
          <label class="form-label">Options</label>
          <input type="text" class="form-control mb-2 option" placeholder="Option 1" required>
          <input type="text" class="form-control mb-2 option" placeholder="Option 2" required>`;
      } else {
        document.getElementById('message').innerHTML =
          `<div class="alert alert-danger">${data.error || "Erreur lors de l'envoi."}</div>`;
      }
    });
  </script>

</body>
</html>
