<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique des Sondages</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Ton CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='historique.css') }}">
</head>

<body>
  <header>
    <h1>Historique des Sondages</h1>
    <a href="/" class="btn btn-outline-light mt-2">Retour à l'accueil</a>
  </header>

  <!-- Barre de recherche + filtres -->
  <div class="container my-4">
    <div class="row g-3 align-items-center">
      <div class="col-md-6">
        <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un sondage...">
      </div>
      <div class="col-md-3">
        <select id="sortSelect" class="form-select">
          <option value="recent">Plus récents</option>
          <option value="old"> Plus anciens</option>
          <option value="popular"> Plus populaires</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-light w-100" onclick="loadHistorique()"> Actualiser</button>
      </div>
    </div>
  </div>

  <main class="container my-4">
    <div class="row g-4" id="historique-list"></div>
  </main>

  <footer>
    &copy; 2025 - Application de Sondages | Historique
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Ton JS -->
  <script src="{{ url_for('static', filename='historique.js') }}"></script>
</body>
</html>
